# Publishes Extrode.Pare, Extrode.Pare.Build, Extrode.Pare.AspNetCore and Extrode.Pare.Cli to
# nuget.org and GitHub Packages and attaches them to a GitHub Release. Same shape as jauntyq's release.yml. Triggered by version
# tags only:
#
#   git tag v0.7.1 && git push origin v0.7.1
#
# The tag must match <Version> in Directory.Build.props; the guard step fails the run otherwise.
# Extrode.Pare.Cli is published here as ONE framework-dependent .NET tool (-p:PareCliFrameworkDependent=true:
# no RID packages, needs the .NET 10 runtime). The NativeAOT CLI and libpare are archives, built on
# one native runner per RID by scripts/pack-cli.sh and scripts/pack-cli.ps1 (the `archives` job),
# attached to the Release with a SHA256SUMS file. A manual run (workflow_dispatch) builds the
# archives and uploads them as workflow artifacts without publishing anything: use it to check
# the runners before tagging.
#
# Trusted publishing (OIDC), not a stored key: NuGet/login exchanges the workflow's short-lived
# OIDC token for a key valid for one hour. The policy on nuget.org must name this file,
# release.yml, and the environment `packages`.
name: release

on:
  push:
    tags: ['v*']
  # Dispatch runs the trusted-publishing check and the archives, and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet.org login (OIDC, short-lived key)
        id: nuget-login
        # Pinned by digest: this step mints the nuget.org publishing key. v1 = 8d19675.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # The nuget.org profile name, not an email address.
          user: ${{ vars.NUGET_USER }}

      - name: Report
        run: |
          if [ -n "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" ]; then
            echo "::notice title=Trusted publishing works::nuget.org issued a short-lived key."
          else
            echo "::error title=No key issued::The token exchange returned nothing. Check the policy's workflow file name and environment."
            exit 1
          fi

  # The whole suite (unit, Integration, Conformance) on three OSes, and a NativeAOT smoke test, before anything is published.
  ci:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # NativeAOT cannot cross OS, so each archive is built on a runner of its own kind. Each job
  # packs only its RIDs; the final step fails when an expected archive is missing. The musl jobs
  # (Docker) also run the archive's binary 20 times and a C program against libpare; the glibc,
  # macOS and Windows archives are checked for presence only (ci.yml smoke-tests those builds).
  archives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, shell: bash, rids: 'linux-x64', args: '--no-docker --rid linux-x64' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, shell: bash, rids: 'linux-arm64', args: '--no-docker --rid linux-arm64' }
          - { name: linux-musl-x64, os: ubuntu-latest, shell: bash, rids: 'linux-musl-x64', args: '--rid linux-musl-x64' }
          - { name: linux-musl-arm64, os: ubuntu-24.04-arm, shell: bash, rids: 'linux-musl-arm64', args: '--rid linux-musl-arm64' }
          - { name: osx, os: macos-latest, shell: bash, rids: 'osx-arm64 osx-x64', args: '--no-docker' }
          - { name: win, os: windows-latest, shell: pwsh, rids: 'win-x64 win-arm64', args: '' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack archives
        if: matrix.shell == 'bash'
        run: scripts/pack-cli.sh ${{ matrix.args }}
      - name: Pack archives (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: scripts/pack-cli.ps1
      - name: Check every expected archive exists
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          ext=tar.gz; [ "${{ matrix.shell }}" = pwsh ] && ext=zip
          for rid in ${{ matrix.rids }}; do
            for f in pare libpare; do
              test -s "tmp/dist/$f-$version-$rid.$ext" || { echo "::error::missing tmp/dist/$f-$version-$rid.$ext"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.name }}
          path: |
            tmp/dist/pare-*.tar.gz
            tmp/dist/pare-*.zip
            tmp/dist/libpare-*.tar.gz
            tmp/dist/libpare-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, archives]
    runs-on: ubuntu-latest
    # Waits for a required reviewer (Settings > Environments > packages) before it runs.
    environment: packages
    permissions:
      contents: write   # gh release create
      id-token: write   # NuGet/login
      packages: write   # push to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SourceLink resolves commit URLs from the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Guard - tag matches Directory.Build.props Version
        run: |
          PROP_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "props=$PROP_VERSION tag=$TAG_VERSION"
          [ "$PROP_VERSION" = "$TAG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME != <Version>$PROP_VERSION"; exit 1; }

      - name: Unit tests
        run: dotnet test --project tests/Extrode.Pare.Tests -c Release

      - name: Pack
        run: |
          for p in Extrode.Pare Extrode.Pare.Build Extrode.Pare.AspNetCore; do
            dotnet pack "src/$p" -c Release -o dist/packages
          done
          dotnet pack src/Extrode.Pare.Cli -c Release -o dist/packages -p:PareCliFrameworkDependent=true

      - name: NuGet.org login (OIDC, short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        # --skip-duplicate: re-running a partly failed release must not abort on a package that
        # already landed.
        run: |
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Push to GitHub Packages
        # The Packages tab of the repository lists what lands here. GITHUB_TOKEN needs
        # packages: write (job permissions). --skip-duplicate as for nuget.org.
        run: |
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ github.token }}" \
              --skip-duplicate
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: dist/archives
          merge-multiple: true

      - name: Checksums
        run: (cd dist/archives && sha256sum * > ../SHA256SUMS) && mv dist/SHA256SUMS dist/archives/ && cat dist/archives/SHA256SUMS

      - name: GitHub Release with package and archive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run for a moved tag finds the release already there. Leave it alone: replacing
          # its packages with this run's rebuilt ones would make them differ from what nuget.org holds.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; leaving it as it is."
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in
            v0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/packages/* dist/archives/* --generate-notes --verify-tag $prerelease
