name: ci

on:
  push:
    # Tags run through release.yml, which calls this workflow before it publishes.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The sample test runs the stripped modules in Deno as well as Node (preinstalled).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.x
      - name: Fetch TypeScript corpus
        run: dotnet run scripts/get-ts-corpus.cs
      - name: Fetch tsc
        run: dotnet run scripts/get-tsc.cs
      - name: Build
        run: dotnet build Pare.slnx -c Release
      # The tests install the browsers; WebKit and Firefox also need system libraries on Linux.
      - name: Browser dependencies
        if: runner.os == 'Linux'
        run: pwsh tests/Extrode.Pare.Integration/bin/Release/net10.0/playwright.ps1 install-deps
      - name: Test
        run: dotnet test --solution Pare.slnx -c Release --no-build
      - name: NativeAOT publish
        run: dotnet publish src/Extrode.Pare.Cli -c Release -r ${{ matrix.rid }} -o publish
      - name: Smoke test AOT binary
        shell: bash
        run: |
          out=$(printf 'let a = 1;\n' | ./publish/pare --stdin)
          test "$out" = "let a = 1;"
