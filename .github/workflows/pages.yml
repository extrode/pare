name: Pages

# Publishes the pre-built documentation site at dist/docs-site to GitHub Pages (pare.extrode.com).
#
# The site is built by hand and committed, because the generator lives in a separate repository.
# Rebuild before merging to main with scripts/build-docs.sh.
#
# main only, on purpose: main is release-only, so nothing reaches the public site without someone
# deciding to publish it. workflow_dispatch covers a redeploy without a release.
on:
  push:
    branches: [main]
    paths:
      - 'dist/docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a cancelled deploy can leave the site on a half-replaced artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs-site

      - id: deployment
        uses: actions/deploy-pages@v5
