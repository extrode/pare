<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pare sample</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <h1>Pare sample</h1>

  <p>Alpine component written in TypeScript (<code>wwwroot/js/counter.ts</code>):</p>
  <div x-data="counter(0)">
    <button type="button" @click="increment()">Click</button>
    <span x-text="label()"></span>
  </div>

  <p>htmx request to a minimal API endpoint:</p>
  <button type="button" hx-get="/fragments/time" hx-target="#time">Server time</button>
  <span id="time"></span>
</body>
</html>
